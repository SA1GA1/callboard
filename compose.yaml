services:
  postgres:
    container_name: postgres
    image: postgres:18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes: 
      - pg_listings_data:/var/lib/postgresql
    restart: always

volumes:
  pg_listings_data: